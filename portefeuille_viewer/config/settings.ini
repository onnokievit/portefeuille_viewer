# Portefeuille Viewer - Configuratie
# Dit is de standaard configuratie. User-specifieke wijzigingen worden
# opgeslagen in ~/.portefeuille_viewer/settings.ini

[interactive_brokers]
host = 127.0.0.1
port = 7496
client_id = 299

[databases]
# Format: name = path | fg_color | bg_color | is_default
ONNO-PRODUCTIE = C:\Users\onno\OneDrive\Beleggen\2025 - portefeuille database 02.03 - ONNO.accdb | white | #09890f | true
MURIEL = C:\Users\onno\OneDrive\Beleggen\2025 - portefeuille database 02.03 - MURIEL.accdb | black | pink | false

[ui]
theme = light
font_size = 10
table_header_bg = #c6c6c6
table_total_bg = #c6c6c6
tab_inactive_bg = #d9d9d9
tab_active_bg = #7a7a7a
tab_hover_bg = #f3eed7

[app]
last_database = ONNO-PRODUCTIE

[env_defaults]
engine_core_snapshot_throttle_ms = 500
ui_web_active_render_ms = 1000
use_engine_core_runtime_v1 = 1
engine_core_runtime_exclusive_v1 = 1
pv_ui_aandelen_web_v1 = 1
ui_aandelen_promoted_v1 = 1
ui_opties_web_v1 = 1
ui_opties_promoted_v1 = 1
ui_optie_tijdswaarde_web_v1 = 1
ui_optie_tijdswaarde_promoted_v1 = 1
ui_sprinters_web_v1 = 1
ui_sprinters_promoted_v1 = 1
ui_single_asset_from_projection_v2 = 1

[comment_colors]
4 = Rood,#f8d7da,#000000
3 = Oranje,#ffeeba,#000000
2 = Groen,#d4edda,#000000
1 = GrijsWit,#8f8f8f,#ffffff
0 = Geen,,
